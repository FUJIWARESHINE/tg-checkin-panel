name: 构建并推送镜像

# 触发：
#   推 main      → edge + sha-xxxxxxx（不动 latest）
#   推 v*.*.*    → 1.2.3 / 1.2 / 1 / latest + sha-xxxxxxx，并创建 GitHub Release
#   手动触发     → 同 main
#
# 单 job 完成全部工作：QEMU + Buildx 一次构建 amd64 + arm64 直接推到 GHCR；
# 配了 Docker Hub Secrets 就再用同一份 GHA 缓存多推一份到 Docker Hub
# （缓存命中，构建阶段几乎不额外耗时）。没有跨 job 传值、没有 digest 合并。
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# 同一 ref 上只保留最新一次运行
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: fujiwareshine/tg-checkin-panel
  # amd64：x86 NAS / PC；arm64：ARM NAS / 树莓派 / Apple Silicon
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: 构建并推送（amd64 + arm64）
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 Release 用
      packages: write # 推 GHCR 用
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        # 在 amd64 runner 上模拟 arm64 执行 RUN 指令（交叉构建必需）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 版本号 --------------------------------------------------------
      # tag v1.2.3 → release=true，version=1.2.3（顺带校验 VERSION 文件）
      # main 分支  → release=false，version=0.0.0-<短SHA>
      - name: 解析版本号
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            file_ver="$(tr -d 'v \t\r\n' < VERSION)"
            if [ "$ver" != "$file_ver" ]; then
              echo "::error::VERSION 文件是 $file_ver，但 tag 是 $ver。先改 VERSION 并提交，再重新打 tag。"
              exit 1
            fi
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- GHCR ----------------------------------------------------------
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # tag v1.2.3 → 1.2.3 / 1.2 / 1（v0.x 不打主版本号）
            type=semver,pattern={{version}},enable=${{ steps.ver.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.ver.outputs.release == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.ver.outputs.release == 'true' && !startsWith(github.ref_name, 'v0.') }}
            # main 分支 → edge
            type=raw,value=edge,enable=${{ steps.ver.outputs.release == 'false' }}
            # 每次都打短 SHA，便于回溯
            type=sha,format=short,prefix=sha-
            # latest 无条件跟随最近一次构建：compose 默认拉 :latest，
            # 以前只有在 tag 发版时才补 latest，main 构建完用户永远拉不到更新
            type=raw,value=latest

      - name: 构建并推送 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Docker Hub（可选，没配 Secrets 自动跳过）-----------------------
      - name: 检查 Docker Hub 配置
        id: hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "repo=docker.io/${DH_USER}/tg-checkin-panel" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过 Docker Hub"
          fi

      - name: 登录 Docker Hub
        if: steps.hub.outputs.on == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签（Docker Hub）
        id: hmeta
        if: steps.hub.outputs.on == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hub.outputs.repo }}
          tags: |
            type=semver,pattern={{version}},enable=${{ steps.ver.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.ver.outputs.release == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.ver.outputs.release == 'true' && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=edge,enable=${{ steps.ver.outputs.release == 'false' }}
            type=sha,format=short,prefix=sha-
            # 与 GHCR 保持一致：latest 跟着最近一次构建走
            type=raw,value=latest

      - name: 构建并推送 Docker Hub
        if: steps.hub.outputs.on == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.hmeta.outputs.tags }}
          labels: ${{ steps.hmeta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 打 tag 时自动发 Release ----------------------------------------
      - name: 创建 GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release 已存在时（重跑同一个 tag）不判失败，镜像已经推完了
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" \
            || echo "::warning::Release 已存在或创建失败，跳过"

      - name: 构建摘要
        run: |
          {
            echo "## 🐳 镜像构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${{ steps.ver.outputs.version }}\` |"
            echo "| 架构 | \`${{ env.PLATFORMS }}\` |"
            echo "| GHCR | \`${{ env.REGISTRY }}/${{ env.IMAGE }}\` |"
            if [ "${{ steps.hub.outputs.on }}" = "true" ]; then
              echo "| Docker Hub | \`${{ steps.hub.outputs.repo }}\` |"
            else
              echo "| Docker Hub | 已跳过（未配 Secrets） |"
            fi
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.ver.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
